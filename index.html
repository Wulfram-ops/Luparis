<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luparis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* VOICE: atelier de MJ, calme et pratique, on improvise en pleine partie
   IDEA: un plateau qu'on sculpte du doigt, comme le mode tactique de Dofus, habillé par biome
   PICTURE: le plateau isométrique lui-même, en grand, dès l'ouverture
   COLOUR and TYPE: le biome colore le plateau ; l'interface reste sobre, accent cuivre ; Cinzel + Alegreya Sans
   LAYOUT: titre discret, barres d'outils et de décor, plateau plein cadre, aide en bas */
:root{color-scheme:light dark;
--bg:light-dark(#eef0e6,#15181a);--ink:light-dark(#22261f,#e6e8e0);--muted:light-dark(#5c6355,#9aa194);
--panel:light-dark(#ffffff,#1f2427);--line:light-dark(#cfd4c4,#343b3f);--acc:#6b7a3c;--acc2:light-dark(#4b5726,#b3c286)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
header{padding:18px max(4vw,16px) 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font:600 clamp(22px,3vw,32px)/1.05 Cinzel,serif;margin:0}
header p{margin:0;color:var(--muted);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:6px max(4vw,16px);align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.grp>span{font-size:14px;color:var(--muted);align-self:center;padding:0 6px 0 8px}
button{font:500 15px "Alegreya Sans",sans-serif;min-height:40px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:color-mix(in oklab,var(--acc) 14%,transparent)}
button[aria-pressed=true]{background:var(--acc);color:#fff}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.dot{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
label{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 8px}
input[type=range]{width:96px;accent-color:var(--acc)}
.golds{display:flex;flex-wrap:wrap;gap:8px 18px}.gold{display:flex;gap:6px;align-items:center}.gold b,.pq b{min-width:30px;text-align:center}.gold .gl{min-width:90px}.gold button,.pq button{min-height:34px;min-width:34px}
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.pot{text-align:left;align-items:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}#c_inv button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:0 10px;font:inherit;cursor:pointer}#c_inv button.go{background:var(--acc);border-color:var(--acc);color:#fff}#c_inv button:disabled{opacity:.4;cursor:not-allowed}.pq .go{margin-left:auto}.pot.empty{opacity:.6}.pq{display:flex;gap:4px;align-items:center}
.items{list-style:none;padding:0;margin:0 0 8px}.items li{display:grid;grid-template-columns:2fr 70px 3fr 36px;gap:6px;margin-bottom:6px}.items input{min-height:36px}#c_inv h4{margin:12px 0 6px}
.ctxbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px max(2vw,8px) 0;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.ctxbar b{margin-right:auto}.ctxbar[hidden]{display:none}
.mks{list-style:none;margin:6px 0 0;padding:0}.mks li{display:grid;grid-template-columns:28px 1fr 36px;gap:6px;align-items:center;margin-bottom:6px}.mks .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#7a3fb0;color:#fff;font-weight:700;font-size:13px}.mks input{min-height:36px}.mks li.sel input{outline:2px solid #7a3fb0}
.hand{margin:10px max(2vw,8px) 0;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.hhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}.hhead h3{margin:0;margin-right:auto}.hsel{display:flex;gap:6px;align-items:center}.hsel select{min-height:38px}
.htrk{display:flex;gap:6px;align-items:center}.htrk button{width:34px;min-height:34px;padding:0}.htrk b{min-width:44px;text-align:center}
.hcards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.hc{flex:0 0 220px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;border:1px solid var(--line);border-top:5px solid #888;background:var(--bg)}
.hc.k-atk{border-top-color:#b0453a}.hc.k-spl{border-top-color:#7a3fb0}.hc.k-man{border-top-color:#c58a1d}.hc.k-def{border-top-color:#2f6f9f}.hc.k-cus{border-top-color:#5c7a4a}.hc.k-add{border-style:dashed}
.hc .ht{font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.75}.hc .hn{font-weight:700;font-size:17px}.hc .hb{font-size:14px;line-height:1.35}
.hc .hbt{display:flex;gap:6px;margin-top:auto}.hc .hbt button{min-height:36px}.hc input,.hc textarea,.hc select{width:100%}
.hand button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:0 10px;font:inherit;cursor:pointer}.hand button.go{background:var(--acc);border-color:var(--acc);color:#fff}.hand button:disabled{opacity:.4;cursor:not-allowed}
.fx{display:flex;flex-wrap:wrap;gap:4px}.inf{display:flex;flex-direction:column;gap:4px;font-size:13px}.inf label{display:flex;gap:6px;align-items:center}.inf select{min-height:32px;flex:1}.chip{font-size:12px;min-height:28px;padding:2px 7px;border-radius:999px}.chip.on{background:#7a3fb0;color:#fff;border-color:#7a3fb0}.hc.k-man .chip.on{background:#c58a1d;border-color:#c58a1d}
.matkf{display:flex;flex-direction:column;gap:6px}.arows{display:flex;flex-direction:column;gap:6px}.arow{display:grid;grid-template-columns:minmax(120px,2fr) repeat(5,auto) 36px;gap:6px}.arow select,.arow input{min-height:36px}@media(max-width:700px){.arow{grid-template-columns:1fr 1fr 1fr}}
.matks{display:flex;flex-direction:column;gap:6px;margin:8px 0}.matk{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}.matk button{min-height:34px;padding:0 10px}
.hlog{margin:8px 0 0;padding-left:18px;font-size:14px}.hlog .cr{color:#2f8f4f;font-weight:700}.hlog .ko{color:#b0453a;font-weight:700}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scn select{min-height:40px}
.stage{user-select:none;-webkit-user-select:none;position:relative;margin:6px max(2vw,8px) 0;height:min(72vh,760px);min-height:380px;border-radius:16px;overflow:hidden;transition:background .4s}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#info{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;pointer-events:none}
.help{padding:14px max(4vw,16px) 28px;color:var(--muted);font-size:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:6px 24px}
.help b{color:var(--ink)}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.prefs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}.prefs button{min-height:36px}
.tabs{display:flex;gap:6px;padding:4px max(4vw,16px) 6px}
.tabs a{font:600 15px "Alegreya Sans",sans-serif;color:var(--ink);text-decoration:none;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:40px;display:inline-flex;align-items:center}
.tabs a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.view[hidden]{display:none}
.scroll{overflow-x:auto;max-width:100%}
.band{padding:8px max(4vw,16px) 32px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h2{font:600 clamp(20px,2.4vw,28px)/1.1 Cinzel,serif;margin:6px 0}
.small{color:var(--muted);font-size:14px}
.bfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.bfil label,.mf label{flex-direction:column;align-items:stretch;gap:3px;padding:0;font-size:14px}
input,select,textarea{font:16px "Alegreya Sans",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--panel);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
td button{min-height:36px;padding:0 10px;border:1px solid var(--line)}
td button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:20px;background:color-mix(in oklab,var(--acc) 14%,transparent);margin:1px 2px 1px 0;white-space:nowrap}
details{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.mf .wide{grid-column:1/-1}
.habs{display:flex;flex-wrap:wrap;gap:4px 12px}.habs label{flex-direction:row;align-items:center;gap:6px;font-size:15px}
.habs input{width:auto;min-height:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{border:1px solid var(--line)}
.row button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.book{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:8px max(4vw,16px) 40px;max-width:1240px}
@media(min-width:900px){.book{grid-template-columns:230px minmax(0,1fr)}.toc{position:sticky;top:12px;align-self:start}}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.toc button{display:flex;width:100%;text-align:left;justify-content:flex-start;min-height:36px;font-size:15px}
.toc .vtag{font-size:13px;color:var(--muted);padding:4px 12px 8px}
.page{background:light-dark(#fbf8f0,#1d2124);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,48px);max-width:820px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.page h2{font:600 clamp(22px,2.6vw,30px)/1.15 Cinzel,serif;margin:36px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--acc);scroll-margin-top:16px}
.page h2:first-of-type{margin-top:10px}
.page h3{font:600 19px/1.2 Cinzel,serif;margin:22px 0 6px}
.page p,.page li{max-width:68ch}
.page .lead{font-size:18px}
.page table{margin:10px 0 14px;font-size:15px}
.page .ex{border-left:3px solid var(--acc);padding:6px 12px;background:color-mix(in oklab,var(--acc) 8%,transparent);border-radius:0 8px 8px 0}
.page .note{color:var(--muted);font-size:15px}
.page .todo{color:var(--muted);font-style:italic}
.sheet{max-width:none}
.shead{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.shead label{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0;font-size:14px}
.shead .nm input{font:600 20px Cinzel,serif}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:15px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}.pill.bad{border-color:#c0392b;color:#c0392b}
.sgrid{display:block;column-width:340px;column-gap:14px;margin-top:8px}.sgrid.c1{columns:1}.sgrid.c2{columns:2}.sgrid.c3{columns:3}.sgrid.c4{columns:4}
.sgrid>.mod{break-inside:avoid;margin:0 0 14px;display:block}.sgrid>.mod.dragging{opacity:.45;outline:2px dashed var(--acc)}.sgrid>.mod{position:relative}.grip{position:absolute;top:8px;right:12px;cursor:grab;opacity:.55;user-select:none;touch-action:none;font-size:18px;line-height:1;padding:4px}.prof{margin-top:10px;display:flex;flex-direction:column;gap:6px}.prof .warn{color:#b0453a;font-size:14px;margin:0}.prof label.ck{display:flex;flex-direction:row;gap:8px;align-items:center;text-align:left}.prof label.ck input{width:20px;height:20px;min-height:0;margin:0;flex:none}
[data-kb]{position:relative}[data-kb]::after{content:attr(data-kb);position:absolute;top:-6px;right:-5px;font:700 10px/1 "Alegreya Sans",sans-serif;padding:2px 4px;border-radius:5px;background:var(--ink);color:var(--panel);opacity:.72;pointer-events:none}
.envdc input{width:64px;min-height:38px}.envdc{display:flex;gap:4px;align-items:center}.rmod{position:relative}
.grp[hidden]{display:none!important}.scn{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.scn>span{flex:none}
.mem li{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;margin-bottom:10px}.mem img{width:96px;border-radius:8px;border:1px solid var(--line)}.mem .row{gap:6px;margin-top:4px;flex-wrap:wrap}
.szl{display:flex;gap:6px;align-items:center;padding:0 6px}
.slay{align-items:center;gap:10px;margin-top:6px}.slay select{min-height:36px}

.scol{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

.card label{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0;font-size:14px}

.cell{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.cell .v{font:700 20px/1.1 "Alegreya Sans",sans-serif;font-variant-numeric:tabular-nums}
.tg{margin:12px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.ti.off{opacity:.6}.sfrow{display:flex;gap:8px;align-items:center}.sfrow input{flex:1;min-width:0}#c_don .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}

.cell .c{font-size:12px;color:var(--muted);min-height:16px}

<h2 id="r-aide">Cheat sheet</h2>
<div class="cheat">
<div class="ch"><h4>Attacks and DCs</h4><p><b>Attack</b>: d20 + mod + Mastery (Tier + 1) against Evasion. Natural 20: double the Mastery dice.</p><p><b>DC</b>: 8 + mod + Mastery. 10 easy, 15 medium, 20 hard, 25 very hard, 30 nearly impossible.</p><p><b>Save</b>: the threat sets the domain, the story sets the intent (Resilience by default).</p></div>
<div class="ch"><h4>Damage and boxes</h4><p>Below Minor: 0 boxes, but 1 Stamina (wear). Minor to Major: 1. Major: 2. Severe: 3.</p><p>At 0 boxes: unconscious, death saves. Resistance and vulnerability apply before thresholds.</p></div>
<div class="ch"><h4>Defense</h4><p><b>Evasion</b> = 10 + Physical Finesse (armor cap) + shield.</p><p><b>Parry</b> (reaction): the blow costs 1 box less. Each extra Parry in the round: 1 Stamina.</p></div>
<div class="ch"><h4>Effects and maneuvers</h4><p>Total value ≤ Tier. Paid in Mana (spell) or Stamina (weapon).</p><p>1: heavy blow, offset, movement, light control, heal (per box). 2: heavy control, persistence, extra target (each). 3: major control, area or whirlwind (successful save = half), extra action.</p></div>
<div class="ch"><h4>Rest</h4><p><b>Short (1 h)</b>: half the missing boxes and Mana, all Stamina.</p><p><b>Long (8 h)</b>: everything, and one less level of exhaustion.</p></div>
<div class="ch"><h4>Distance and terrain</h4><p>1 tile = 5 ft (1.5 m), diagonals included; +5 ft per height level.</p><p>+1 half cover, +2 cover, +3 impassable; −1 difficult, −2 impassable.</p></div>
<div class="ch wide"><h4>Conditions</h4><dl class="cond">
<dt>Blinded</dt><dd>Disadvantage on its attacks, advantage against it.</dd><dt>Charmed</dt><dd>Can't attack the charmer.</dd><dt>Deafened</dt><dd>Can't hear.</dd>
<dt>Exhaustion</dt><dd>−2 to d20s and −5 ft per level; death at 6.</dd><dt>Frightened</dt><dd>Disadvantage while it sees the source; can't approach it.</dd><dt>Grappled</dt><dd>Speed 0.</dd>
<dt>Incapacitated</dt><dd>No actions or reactions, so no Parry.</dd><dt>Invisible</dt><dd>Advantage on its attacks, disadvantage against it.</dd><dt>Paralyzed</dt><dd>Incapacitated; a melee hit is a critical.</dd>
<dt>Petrified</dt><dd>Incapacitated, resistance to all damage.</dd><dt>Poisoned</dt><dd>Disadvantage on attacks and checks.</dd><dt>Prone</dt><dd>Crawls; disadvantage on its attacks; advantage on melee against it.</dd>
<dt>Restrained</dt><dd>Speed 0; disadvantage on attacks and Physical saves; advantage against it.</dd><dt>Stunned</dt><dd>Incapacitated, fails Physical saves; advantage against it.</dd><dt>Unconscious</dt><dd>Incapacitated, prone; a melee hit is a critical.</dd></dl></div>
</div>
<p class="lead">Luparis plays with the D&D 5.5 rules. This book only describes what changes. Anything not written here stays the D&D rule.</p>
<h2 id="r-matrice">1. The Matrix of Intents</h2>
<p>The six D&D ability scores are replaced by nine cells: an intent (Power, Finesse, Resilience) applied to a domain (Physical, Mental, Social). Always name the intent with its domain: Physical Finesse, Mental Resilience. Each cell has a modifier, like a D&D ability. The context of the action picks the cell, never the school of magic.</p>
<p><b>Six stats, nine cells.</b> You buy six stats: the three intents and the three domains. Each cell is the sum of its intent and its domain: Physical Power = Power + Physical. A stat starts at 0 and can drop to −1. Being bad at something is a choice: lowering a stat to −1 gives back 20 XP.</p>
<p><b>Cap by level:</b> stats up to +3 until level 5, +5 until level 10, +7 until level 15, no cap beyond. XP stays the real limit: each +1 costs double the previous one.</p>
<table><thead><tr><th></th><th>Physical</th><th>Mental</th><th>Social</th></tr></thead><tbody>
<tr><th>Power</th><td>Strength</td><td>Intellect, offensive spells</td><td>Authority, intimidation</td></tr>
<tr><th>Finesse</th><td>Dexterity, Evasion</td><td>Perception, subtle spells</td><td>Persuasion, deception</td></tr>
<tr><th>Resilience</th><td>Constitution: thresholds, Stamina</td><td>Willpower: Mana, resisting magic</td><td>Composure: resisting influence</td></tr></tbody></table>
<p class="ex">Example: an Aegis mage who projects an imposing aura during a negotiation uses Social Power. If they forge a hammer of light to strike, they use Mental Power.</p>
<h2 id="r-perso">2. The character</h2>
<p>There are no classes. Each character spends XP on the schools of magic, weapon masteries and stats they want. Their stats tell their life story, whatever their people: no race gives a bonus.</p>
<p>Everyone starts with a d6 hit die, then buys d8, d10 and d12 with XP.</p>
<p><b>Speed:</b> 6 tiles (30 ft) per turn. The Fleet-footed talent adds 2 tiles per rank (2 ranks, 40 XP each). Heavy armor costs 2 tiles.</p>
<h3>XP costs (v0.4)</h3>
<p>Level equals XP earned divided by 100: 150 XP to create a level 1 character, 2,000 at level 20. The Character tab does all the math.</p>
<table><thead><tr><th>Purchase</th><th>Cost of each step</th><th>Total</th></tr></thead><tbody>
<tr><td>Stat (intent or domain), each +1</td><td>20, 40, 80, 160, 320… (−1 gives back 20)</td><td>+3: 140, +5: 620</td></tr><tr><td>Talent (chapter 7), per rank</td><td>40, 80, 160 (Expertise: 20, 40, 80)</td><td>—</td></tr><tr><td>Armor training: light, medium, heavy</td><td>20, 40, 80</td><td>140</td></tr><tr><td>Shield training</td><td>40</td><td>40</td></tr>
<tr><td>Tier in a discipline (school, weapon family or Apex), 1 to 5</td><td>40, 80, 160, 240, 320</td><td>840</td></tr>
<tr><td>Hit die d8, d10, d12</td><td>80, 160, 240</td><td>480</td></tr></tbody></table>
<p><b>Armor and shield training:</b> like proficiencies in D&D. Wearing armor you are not trained for gives no armor value (your thresholds are those of an unarmored body) and −2 Evasion. A shield without training gives no bonus and no Parry. Medium armor needs light training first, heavy armor needs medium.</p>
<p><b>Specialization:</b> your disciplines are ranked by Tier. The highest costs normal price, the 2nd ×1.5, the 3rd ×2, every further one ×3. At level 20 (2,000 XP), that buys one discipline at Tier 5 and a second at Tier 4, with the matrix and a d8; a tank who takes the d12 settles for Tier 5 and Tier 3.</p>
<p><b>Tier gates:</b> Tier 2 from level 3, Tier 3 from 5, Tier 4 from 11, Tier 5 from 17, like D&D's major tiers.</p>
<h2 id="r-defense">3. Defense: Evasion and armor</h2>
<p>Armor Class is gone. The attacker rolls d20 + bonus against the target's <b>Evasion</b>. On a hit, <b>armor</b> decides how much the blow costs.</p>
<p><b>Evasion = 10 + Physical Finesse (capped by armor) + shield + other bonuses.</b></p>
<p><b>Armor value = the armor's base AC in D&D − 10.</b> It sets the Minor threshold and adds to the Major and Severe thresholds.</p>
<table><thead><tr><th>Armor</th><th>Category</th><th>Finesse in Evasion</th><th class="r">Value</th></tr></thead><tbody>
<tr><td>None</td><td>—</td><td>full</td><td class="r">0</td></tr><tr><td>Leather</td><td>Light</td><td>full</td><td class="r">1</td></tr><tr><td>Studded leather</td><td>Light</td><td>full</td><td class="r">2</td></tr>
<tr><td>Chain shirt</td><td>Medium</td><td>max +2</td><td class="r">3</td></tr><tr><td>Breastplate, scale mail</td><td>Medium</td><td>max +2</td><td class="r">4</td></tr><tr><td>Half plate</td><td>Medium</td><td>max +2</td><td class="r">5</td></tr>
<tr><td>Chain mail</td><td>Heavy</td><td>none</td><td class="r">6</td></tr><tr><td>Splint</td><td>Heavy</td><td>none</td><td class="r">7</td></tr><tr><td>Plate</td><td>Heavy</td><td>none</td><td class="r">8</td></tr></tbody></table>
<h3>Shields</h3>
<p><b>Parry (reaction):</b> when you are hit, the blow costs one box less (2 becomes 1, 1 becomes 0). Once per round; each extra Parry costs 1 Stamina.</p>
<table><thead><tr><th>Shield</th><th class="r">Evasion</th><th>Parry</th><th>Special</th></tr></thead><tbody>
<tr><td>Buckler</td><td class="r">+0</td><td>Melee only</td><td>Hand almost free: you can cast or hold an item</td></tr>
<tr><td>Small shield</td><td class="r">+1</td><td>Yes</td><td>Light, no drawback</td></tr>
<tr><td>Heater shield</td><td class="r">+1</td><td>Yes, also against missiles</td><td>The standard shield</td></tr>
<tr><td>Large shield</td><td class="r">+2</td><td>Yes + Intercept</td><td>Disadvantage on Stealth</td></tr>
<tr><td>Tower shield</td><td class="r">+2</td><td>Yes + Intercept</td><td>Plant it (bonus action): cover for you and one ally behind; speed −10 ft (3 m) while carried</td></tr></tbody></table>
<p><b>Intercept:</b> you can use your Parry to protect an adjacent ally instead.</p>
<h2 id="r-vitalite">4. Damage and Vitality</h2>
<p>There are no more hit points to subtract. Compare a blow's damage to the target's thresholds:</p>
<table><thead><tr><th>Damage of the blow</th><th class="r">Boxes lost</th></tr></thead><tbody>
<tr><td>Below the Minor threshold</td><td class="r">0 (but wear applies)</td></tr><tr><td>From Minor to Major</td><td class="r">1</td></tr><tr><td>Major or more</td><td class="r">2</td></tr><tr><td>Severe or more</td><td class="r">3</td></tr></tbody></table>
<ul><li><b>Minor threshold</b> = armor value</li><li><b>Base</b> = maximum hit die value + level + Physical Resilience modifier</li><li><b>Major threshold</b> = Base + armor value</li><li><b>Severe threshold</b> = 2 × Base + armor value</li><li><b>Vitality boxes</b> = 1 + (level × hit die ÷ 12), rounded up</li></ul>
<table><thead><tr><th>Level</th><th class="r">d6</th><th class="r">d8</th><th class="r">d10</th><th class="r">d12</th></tr></thead><tbody>
<tr><td>1</td><td class="r">2</td><td class="r">2</td><td class="r">2</td><td class="r">2</td></tr><tr><td>5</td><td class="r">4</td><td class="r">5</td><td class="r">6</td><td class="r">6</td></tr><tr><td>10</td><td class="r">6</td><td class="r">8</td><td class="r">10</td><td class="r">11</td></tr><tr><td>20</td><td class="r">11</td><td class="r">15</td><td class="r">18</td><td class="r">21</td></tr></tbody></table>
<p><b>Wear:</b> a blow stopped by armor costs no box, but it costs 1 Stamina. When Stamina is empty, each stopped blow costs a box. Nobody is invincible against numbers.</p>
<p><b>At 0 boxes:</b> the character falls unconscious and makes death saving throws, as in D&D.</p>
<p class="note">Calibration: at every level tested (1, 5 and 10), a character drops after as many attacks as in D&D, within 10%.</p>
<h2 id="r-maitrise">5. Mastery and magic</h2>
<p>Spells and weapons follow the same rule. Your <b>Mastery</b> in a school or a weapon is your Tier, from 1 to 5. It sets how many dice you roll; what you use sets the die type.</p>
<ol><li><b>Basic attack, free.</b> Weapon: Mastery × weapon die + modifier. School's basic spell: Mastery × the school's die, no modifier (see the table of schools).</li>
<li><b>Effects.</b> Each effect is worth 1 to 5. The total costs that much Mana and cannot exceed your Tier in the school.</li>
<li><b>Circumstances.</b> A bonus or a penalty changes Mastery by ±1: an inspiring ally, Rage, a weakened or blinded target.</li></ol>
<h3>The schools</h3><p>Each school has its own damage die (basic spell and infusion) and an <b>affinity</b>: a signature effect that costs it less. The smaller the die, the stronger the affinity.</p>
<table><thead><tr><th>School</th><th>Die</th><th>Affinity</th><th>Domain</th></tr></thead><tbody>
<tr><td>Surge</td><td>d12</td><td>—</td><td>Destruction, like evocation</td></tr>
<tr><td>Mirage</td><td>d8</td><td>Heavy control 1, major control 2</td><td>Psychic damage, illusions, fear and charm</td></tr>
<tr><td>Eidolon</td><td>d8</td><td>Persistence 1</td><td>Souls: curses and purification</td></tr>
<tr><td>Aegis</td><td>d8</td><td>Aegis ward 1</td><td>Energy condensed into matter: shields, summoned weapons</td></tr>
<tr><td>Crucible</td><td>d8</td><td>Heal: 2 boxes per point</td><td>Transmutation and healing</td></tr>
<tr><td>Horizon</td><td>d6</td><td>Offset 0 (free); the only school that can teleport</td><td>Space and time: teleportation, portals, slowing time</td></tr>
<tr><td>Harmony</td><td>d6</td><td>Multiply 1 per target</td><td>Resonance: bards, shaping the battlefield</td></tr></tbody></table>
<h3>Weapon masteries</h3><p>You buy one mastery per weapon family; it covers every weapon of that family. The weapon's size sets the die. Each school's basic spell uses its own die (table below).</p>
<table><thead><tr><th>Family</th><th>Examples</th><th>Special</th></tr></thead><tbody><tr><td>Cutting weapons</td><td>Sword, axe, sabre, scimitar</td><td>To be defined</td></tr><tr><td>Thrusting weapons</td><td>Rapier, dagger, shortsword, estoc</td><td>To be defined</td></tr><tr><td>Blunt weapons</td><td>Mace, hammer, flail, staff</td><td>Proposal: ignores 2 points of armor value</td></tr><tr><td>Polearms</td><td>Spear, halberd, glaive, pike</td><td>Proposal: reach, strikes at 10 ft (3 m)</td></tr><tr><td>Ranged and thrown weapons</td><td>Bow, crossbow, javelin, sling</td><td>Ranged attacks</td></tr><tr><td>Martial arts</td><td>Fists, feet, knees, elbows</td><td>Uses Physical Finesse. d6 with one hand busy, d8 with both hands free. Proposal: cannot be disarmed, and grabbing or tripping needs no weapon</td></tr><tr><td>Natural weapons</td><td>Claws, fangs, horns, tail</td><td>Uses Physical Power. The die depends on the natural weapon's size, not on hands: small d6, medium d8, large d10, huge d12. Cannot be disarmed; tied to the people or a transformation</td></tr></tbody></table>
<table><thead><tr><th>Size</th><th>Die</th></tr></thead><tbody><tr><td>One-handed weapon</td><td>d6</td></tr><tr><td>Versatile weapon held in one hand</td><td>d8</td></tr><tr><td>Versatile weapon held in two hands</td><td>d10</td></tr><tr><td>Two-handed weapon</td><td>d12</td></tr></tbody></table>
<h3>Spell effects</h3>
<table><thead><tr><th>Effect</th><th class="r">Value</th></tr></thead><tbody>
<tr><td>Heavy blow: if the spell hits, +1 box (once per spell)</td><td class="r">1</td></tr><tr><td>Offset: cast from another point</td><td class="r">1</td></tr><tr><td>Non-instant movement of yourself or a target (flight, a push…)</td><td class="r">1</td></tr><tr><td>Horizon only: teleporting yourself or a willing target (an ally); Multiply for each extra person, as when opening a portal</td><td class="r">2</td></tr><tr><td>Horizon only: teleporting an enemy target, which makes a saving throw</td><td class="r">3</td></tr>
<tr><td>Split: one more target</td><td class="r">2 per target</td></tr><tr><td>Light control: push, slow</td><td class="r">1</td></tr><tr><td>Heavy control: pin, restrain, blind</td><td class="r">2</td></tr><tr><td>Major control: stun, paralyze</td><td class="r">3</td></tr>
<tr><td>Persistence or wall: the effect lasts 1 minute</td><td class="r">2</td></tr><tr><td>Area: every creature within 20 ft (6 m); as in D&D, a successful save takes half damage</td><td class="r">3</td></tr></tbody></table>
<p class="ex">Example: a Tier 2 Crucible mage casts their earth spike for free (2d8). Pinning the target under rock is a value 2 effect: it costs 2 Mana. Pin + Area (2 + 3 = 5) needs Tier 5.</p>
<h3>Mana</h3>
<p>Mana comes from the Tiers bought in schools: each school adds Mana by its Tier, and schools add up. A martial character who dabbles in one school only gets 2 to 6 points. Recovery is covered in the Healing and rest chapter.</p>
<table><thead><tr><th>Tier in the school</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th></tr></thead><tbody><tr><td>Mana gained (total)</td><td class="r">2</td><td class="r">6</td><td class="r">14</td><td class="r">24</td><td class="r">36</td></tr></tbody></table>
<p><b>Mental Resilience bonus:</b> + modifier × half your highest Tier in magic, rounded down.</p>
<p class="note">Benchmarks for a pure mage: level 1, 2 Mana; level 5 (Tiers 3 and 1), 16; level 10 (Tiers 3, 3 and 2), 34; level 20 (Tiers 5, 4 and 3), 74. That is a D&D wizard's day, within 15%.</p>
<h2 id="r-souffle">6. Stamina</h2>
<p>Stamina is the body's exhaustion, as Mana is the mind's. It refills completely on a short rest.</p>
<p><b>Pool = the Stamina gained from each weapon family you master + Physical Resilience modifier.</b> A pure mage only has their modifier.</p>
<table><thead><tr><th>Tier in the family</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th></tr></thead><tbody><tr><td>Stamina gained (total)</td><td class="r">1</td><td class="r">3</td><td class="r">7</td><td class="r">12</td><td class="r">18</td></tr></tbody></table>
<p><b>Stamina pays for:</b> martial maneuvers, Parries beyond the first, wear, and an extra action on your turn (3 Stamina, for everyone). <b>It never pays</b> for spell effects.</p>
<table><thead><tr><th>Maneuver</th><th class="r">Value</th></tr></thead><tbody>
<tr><td>Heavy blow: if the attack hits, +1 box</td><td class="r">1</td></tr><tr><td>Cleave: one more adjacent enemy</td><td class="r">2 per target</td></tr><tr><td>Charge or leap: move before striking</td><td class="r">1</td></tr>
<tr><td>Throw or reach: strike farther</td><td class="r">1</td></tr><tr><td>Shove, guard break</td><td class="r">1</td></tr><tr><td>Disarm, trip, grapple</td><td class="r">2</td></tr>
<tr><td>Held stance: an effect kept for 1 minute</td><td class="r">2</td></tr><tr><td>Whirlwind: every adjacent enemy</td><td class="r">3</td></tr><tr><td>Extra Parry this round</td><td class="r">1</td></tr><tr><td>Extra action this turn</td><td class="r">3</td></tr></tbody></table>
<p class="ex">At level 5, a fighter at Tier 3 in cutting weapons and Tier 1 in ranged weapons, with +3 Physical Resilience, has 11 Stamina per fight, 33 over a day with two short rests. A mage has 19 Mana for the whole day: the mage hits hard once, the fighter goes the distance.</p>
<h3>Apex</h3><p>The Apex is abnormal physical power: it is not magic, but it is not normal either. It is bought by Tier like a weapon family (same XP costs and Tier gates).</p><ul><li><b>Breath:</b> each Apex Tier adds Breath exactly like a weapon family (1, 3, 7, 12, 18 cumulative).</li><li><b>Natural armor = 2 × Apex Tier</b> (2 to 10). It does not stack with worn armor: keep the better value. Natural armor never limits Evasion.</li><li><b>Infusion:</b> the Apex can infuse a weapon strike (see below).</li></ul>
<h3>Infusion (v0.3)</h3><p>A character who masters both a weapon family and a source of power can infuse the strike: the strike deals extra damage. The infusion has a value from 1 up to your Tier in the source, and <b>each point costs 1 Mana</b> (a school) <b>or 1 Breath</b> (the Apex) and adds <b>one die</b>: the school's damage die (d8) for a school, the weapon's die for the Apex. Paid when the attack is declared, even on a miss; the extra dice are added to that strike's damage. The source is a magic school (a Crucible adept sharpens or densifies a cutting blade, an Aegis adept wraps a mace in solidified energy) or the Apex (a blow struck with outrageous strength). One infusion per strike.</p><p><b>Damage types come from the story.</b> At character creation, the player and the GM agree on what the character's school can produce: Aegis, being solidified energy, will hardly deal anything but force, bludgeoning or physical damage; a Surge adept may deal force, fire or radiant damage, depending on their lore and what they know how to do. The scene can tighten or widen those limits.</p>
<h2 id="r-talents">7. Talents</h2>
<p>Talents are the class features of D&D, sold à la carte. Buy them with XP like everything else, as many as you like, as long as the story follows: a Rage needs a reason to rage, a Companion needs to be met. Rank 2 is open from level 5, rank 3 from level 11. Unless noted, a talent costs 40, 80 then 160 XP per rank.</p>

<tr><td><b>Second wind</b></td><td><b>Rank 1:</b> Bonus action, once per short rest: regain 1 box and 2 Stamina.<br><b>Rank 2:</b> 2 boxes and 4 Stamina, twice per short rest.</td><td>40, 80</td></tr>

<h3>Magic and nature</h3><table><thead><tr><th>Talent</th><th>Effect</th><th>XP per rank</th></tr></thead><tbody>
<tr><td><b>Metamagic</b></td><td><b>Rank 1:</b> Subtle spell: no visible gesture or words, no extra cost. Quickened spell: cast a spell as a bonus action for +2 Mana, once per turn.<br><b>Rank 2:</b> Overcharge: a spell's effects may exceed your Tier by 1; that extra point costs 2 Mana and 1 Stamina.<br><b>Rank 3:</b> Lingering spell: Persistence lasts 10 minutes instead of 1. Twinned spell: the first Multiply of each spell costs 1 instead of 2.<br><i>Requires: a school at Tier 1</i></td><td>40, 80, 160</td></tr>
<tr><td><b>Shapeshifting</b></td><td><b>Rank 1:</b> Action, 2 Mana or 2 Stamina: take the shape of a beast you have seen, for 1 hour. You keep your mental and social cells, your boxes and your Mana; you take the beast's Evasion, speed, senses and attacks (Bestiary), and use the better thresholds, yours or its. No spells. Rank 1: CR 1/2 or less, no flying or swimming.<br><b>Rank 2:</b> CR 2 or less, swimming allowed.<br><b>Rank 3:</b> CR 4 or less, flying allowed; once per shape you may switch to another form at no cost.</td><td>40, 80, 160</td></tr>
<tr><td><b>Lay on hands</b></td><td><b>Rank 1:</b> A pool of healing equal to half your level (rounded up) in boxes, refilled by a long rest. Action: touch a creature and spend boxes from the pool to heal it.<br><b>Rank 2:</b> The pool equals your level; 1 point also cures poisoned or a disease.</td><td>40, 80</td></tr>
<tr><td><b>Companion</b></td><td><b>Rank 1:</b> A beast bound to you (Bestiary, CR 1/4 or less). It acts on your initiative when you command it (bonus action); otherwise it only defends itself. If it dies, a new one answers an 8-hour ritual.<br><b>Rank 2:</b> CR 1 or less; you share its senses as an action.<br><b>Rank 3:</b> CR 3 or less; it acts on its own without a command.</td><td>40, 80, 160</td></tr>
</tbody></table>
<h3>Group</h3><table><thead><tr><th>Talent</th><th>Effect</th><th>XP per rank</th></tr></thead><tbody>
<tr><td><b>Inspiration</b></td><td><b>Rank 1:</b> Bonus action, 1 Mana or 1 Stamina: an ally who hears you gains +1 Mastery on their next roll within 10 minutes.<br><b>Rank 2:</b> The ally also regains 1 Stamina, and you can grant the bonus as a reaction after they roll, before the GM gives the result.</td><td>40, 80</td></tr>
<tr><td><b>Tag team</b></td><td>Once per short rest, when you and an ally act together on the same target or task, you both roll the d20 and both keep the better result.</td><td>40</td></tr>
<tr><td><b>Rallying cry</b></td><td><b>Rank 1:</b> Bonus action, once per short rest: every ally within 30 ft who hears you regains 2 Stamina and ignores frightened until your next turn.<br><b>Rank 2:</b> Twice per short rest, and a stabilized ally at 0 boxes gets back up with 1 box.</td><td>40, 80</td></tr>
</tbody></table>
<h3>Expertise</h3><p>Pick a precise field: lockpicking, tracking, herbalism, the history of Luparis, sailing… Your checks in that field add +2, +4 then +6 (ranks 1 to 3, for 20, 40 then 80 XP). Buy it for as many fields as you like. It is the answer to "how good is my character at this", outside combat.</p>
<h2 id="r-jets">8. Rolls, DCs and conditions</h2>
<p>Rolls follow D&D, with Mastery replacing the proficiency bonus.</p>
<ul><li><b>Mastery bonus = Tier + 1</b> (+2 to +6).</li><li><b>Attack roll</b> = d20 + cell modifier + Mastery bonus, against Evasion. On a natural 20, double the Mastery dice.</li><li><b>Spell or maneuver DC</b> = 8 + modifier of the cell used + Mastery bonus.</li><li><b>DC of an effect left on the ground</b> (flames, acid, ice, webs…) = 10 + its author's Resilience, in the domain the story points to (physical, mental or social). On the map, set the DC next to the Effect tool.</li><li><b>Elevation on the battle map:</b> a tile at elevation 1 is difficult terrain; elevation 2 needs a jump or a climb; elevation 3 needs a high jump (only characters strong enough), flight or a climbing check. A jump uses Physical Power, a climb Physical Power or Finesse, DC set by the GM.</li><li><b>Resistance and vulnerability</b> halve or double damage before comparing it to thresholds.</li></ul>
<h3>Saving throws</h3>
<table><thead><tr><th>D&D save</th><th>Luparis domain</th></tr></thead><tbody>
<tr><td>Strength, Dexterity, Constitution</td><td>Physical</td></tr><tr><td>Intelligence, Wisdom</td><td>Mental</td></tr><tr><td>Charisma</td><td>Social</td></tr></tbody></table>
<p><b>The intent comes from the story.</b> The threat sets the domain; how the player describes their reaction sets the intent. Resilience is the default. Diving away from an explosion: Physical Finesse. Holding firm against a shove: Physical Power. Enduring a poison: Physical Resilience. Seeing through an illusion: Mental Finesse. The GM confirms the description fits the situation.</p>
<h3>Difficulty</h3>
<table><thead><tr><th class="r">DC</th><th>Difficulty</th></tr></thead><tbody><tr><td class="r">10</td><td>Easy</td></tr><tr><td class="r">15</td><td>Medium</td></tr><tr><td class="r">20</td><td>Hard</td></tr><tr><td class="r">25</td><td>Very hard</td></tr><tr><td class="r">30</td><td>Nearly impossible</td></tr></tbody></table>
<h3>Control effects</h3>
<p>A condition lasts until the end of the target's next turn. With Persistence, the target repeats its save at the end of each of its turns.</p>
<table><thead><tr><th>Effect</th><th class="r">Value</th><th>Possible conditions</th></tr></thead><tbody>
<tr><td>Light control</td><td class="r">1</td><td>Pushed 10 ft (3 m), or slowed (−10 ft speed)</td></tr><tr><td>Heavy control</td><td class="r">2</td><td>Prone, grappled, restrained, blinded, deafened, frightened, charmed</td></tr><tr><td>Major control</td><td class="r">3</td><td>Stunned, paralyzed</td></tr></tbody></table>
<p><b>No damage over time:</b> burning, bleeding or gnawing poison become a single hit, or the poisoned condition.</p>
<h3>Conditions</h3>
<table><thead><tr><th>Condition</th><th>Effect</th></tr></thead><tbody>
<tr><td>Blinded</td><td>Fails anything that needs sight. Disadvantage on its attacks, advantage on attacks against it.</td></tr>
<tr><td>Charmed</td><td>Can't attack the charmer, who has advantage on social checks against it.</td></tr>
<tr><td>Deafened</td><td>Can't hear; fails anything that needs hearing.</td></tr>
<tr><td>Exhaustion</td><td>Levels 1 to 6: each level gives −2 to every d20 and −5 ft speed. Level 6 is death. A long rest removes one level.</td></tr>
<tr><td>Frightened</td><td>Disadvantage on its rolls while it sees the source; can't willingly move closer to it.</td></tr>
<tr><td>Grappled</td><td>Speed 0. Disadvantage on attacks against anyone but the grappler. Escape: action, Physical check against the DC.</td></tr>
<tr><td>Incapacitated</td><td>No action, bonus action or reaction, so it can't Parry.</td></tr>
<tr><td>Invisible</td><td>Advantage on its attacks, disadvantage on attacks against it, as long as it isn't located.</td></tr>
<tr><td>Paralyzed</td><td>Incapacitated, speed 0. Fails Physical saves; advantage against it, and a melee hit is a critical.</td></tr>
<tr><td>Petrified</td><td>Turned to stone and incapacitated; resistance to all damage.</td></tr>
<tr><td>Poisoned</td><td>Disadvantage on attack rolls and checks.</td></tr>
<tr><td>Prone</td><td>Crawls; standing up costs half its movement. Disadvantage on its attacks. Advantage on melee attacks against it, disadvantage at range.</td></tr>
<tr><td>Restrained</td><td>Speed 0. Disadvantage on its attacks and Physical saves; advantage on attacks against it.</td></tr>
<tr><td>Stunned</td><td>Incapacitated. Fails Physical saves; advantage on attacks against it.</td></tr>
<tr><td>Unconscious</td><td>Incapacitated and prone, drops what it holds. Fails Physical saves; advantage against it, and a melee hit is a critical.</td></tr></tbody></table>
<h2 id="r-soins">9. Healing and rest</h2>
<p>You recover in three ways: rest, consumables and magic. D&D hit dice are no longer spent to heal; they only set thresholds and boxes.</p>
<h3>Rest</h3>
<table><thead><tr><th>Rest</th><th>Duration</th><th>Vitality boxes</th><th>Mana</th><th>Stamina</th></tr></thead><tbody>
<tr><td>Short</td><td>1 hour</td><td>Half the missing boxes (rounded up)</td><td>Half the missing Mana</td><td>All</td></tr>
<tr><td>Long</td><td>8 hours</td><td>All</td><td>All</td><td>All, and one less level of exhaustion</td></tr></tbody></table>
<h3>Consumables</h3>
<table><thead><tr><th>Consumable</th><th>Effect</th></tr></thead><tbody>
<tr><td>Potion of healing</td><td>1 box</td></tr><tr><td>Potion of greater healing</td><td>2 boxes</td></tr><tr><td>Potion of superior healing</td><td>3 boxes</td></tr><tr><td>Potion of supreme healing</td><td>5 boxes</td></tr>
<tr><td>Hot meal (during a short rest)</td><td>1 more box than the rest gives</td></tr><tr><td>Vigor tonic</td><td>3 Stamina (proposal)</td></tr><tr><td>Mana elixir</td><td>2, 6 or 14 Mana by quality (to be confirmed)</td></tr></tbody></table>
<h3>Healing magic</h3>
<p>The Crucible heals by closing the flesh; Harmony makes natural regeneration resonate. Healing is an effect like any other, paid in Mana and capped by Tier.</p>
<table><thead><tr><th>Effect</th><th class="r">Value</th><th>Schools</th></tr></thead><tbody>
<tr><td>Stabilize a creature at 0 boxes</td><td class="r">0</td><td>Crucible, Harmony (basic spell)</td></tr>
<tr><td>Heal: the target regains 1 box</td><td class="r">1 per box</td><td>Crucible, Harmony</td></tr>
<tr><td>Resting song: during a short rest, the party regains 1 more box</td><td class="r">1</td><td>Harmony, out of combat</td></tr></tbody></table>
<p>Healing combines with other effects: Heal + Offset to heal at range, Heal + Area to heal the whole party (value 4). A creature at 0 boxes that regains a box wakes up.</p>
<p class="ex">Proposal for the Aegis, which protects rather than heals. Aegis shield, value 2: an ally cancels the next box they would lose before your next turn.</p>
<h2 id="r-mj">10. Game Master's chapter</h2>
<h3>Converting a D&D monster</h3>
<p>Evasion = the monster's AC. Thresholds and boxes depend on its CR. The Bestiary on this site does the math automatically.</p>
<table><thead><tr><th>CR</th><th class="r">Major</th><th class="r">Severe</th><th class="r">Boxes</th></tr></thead><tbody>
<tr><td>0 to 1</td><td class="r">8</td><td class="r">16</td><td class="r">HP ÷ 6 (min. 1)</td></tr><tr><td>2 to 4</td><td class="r">12</td><td class="r">24</td><td class="r">HP ÷ 6</td></tr><tr><td>5 to 10</td><td class="r">18</td><td class="r">36</td><td class="r">HP ÷ 12</td></tr><tr><td>11 to 16</td><td class="r">23</td><td class="r">46</td><td class="r">HP ÷ 18</td></tr><tr><td>17 and up</td><td class="r">28</td><td class="r">56</td><td class="r">HP ÷ 24</td></tr></tbody></table>
<h3>Ruling an unexpected effect</h3>
<p>Find the D&D spell closest to the player's idea. Its level gives the value: levels 1 to 3, same value; 4 and 5, value 4; 6 and up, value 5.</p>
<h3>Terrain</h3>
<p>On the tactical map: +1 half cover, +2 cover, +3 impassable obstacle; −1 difficult terrain, −2 impassable.</p>

<p class="lead">Luparis se joue avec les règles de D&D 5.5. Ce livre ne décrit que ce qui change. Tout ce qui n'y figure pas reste la règle de D&D.</p>
<h2 id="r-matrice">1. La Matrice des intentions</h2>
<p>Les six caractéristiques de D&D sont remplacées par neuf cases : une intention (Puissance, Finesse, Résistance) appliquée à un domaine (Physique, Mental, Social). On annonce toujours l'intention d'abord : « Finesse physique », « Résistance mentale ». Chaque case a un modificateur, comme une caractéristique de D&D. C'est le contexte de l'action qui choisit la case, jamais l'école de magie.</p>
<p><b>Six stats, neuf cases.</b> On achète six stats : les trois intentions et les trois domaines. Chaque case est la somme de son intention et de son domaine : Puissance physique = Puissance + Physique. Une stat part de 0 et peut descendre à −1. Être mauvais dans un domaine est un choix : descendre une stat à −1 rend 20 XP.</p>
<p><b>Plafond par niveau :</b> stats jusqu'à +3 jusqu'au niveau 5, +5 jusqu'au 10, +7 jusqu'au 15, sans plafond au-delà. L'XP reste la vraie limite : chaque +1 coûte le double du précédent.</p>
<table><thead><tr><th></th><th>Physique</th><th>Mental</th><th>Social</th></tr></thead><tbody>
<tr><th>Puissance</th><td>Force</td><td>Intelligence, sorts offensifs</td><td>Autorité, intimidation</td></tr>
<tr><th>Finesse</th><td>Dextérité, Esquive</td><td>Perception, sorts subtils</td><td>Persuasion, tromperie</td></tr>
<tr><th>Résistance</th><td>Constitution : seuils, Souffle</td><td>Volonté : Mana, résister à la magie</td><td>Sang-froid : résister à l'influence</td></tr></tbody></table>
<p class="ex">Exemple : un mage de l'Égide qui projette une aura imposante pendant une négociation utilise la Puissance sociale. S'il forge un marteau de lumière pour frapper, il utilise la Puissance mentale.</p>
<h2 id="r-perso">2. Le personnage</h2>
<p>Il n'y a pas de classes. Chaque personnage achète en XP les écoles de magie, les maîtrises d'armes et les stats qu'il veut. Ses statistiques racontent son vécu, quel que soit son peuple : aucune race ne donne de bonus.</p>
<p>Tout le monde commence avec un dé de vie d6. On achète ensuite d8, d10 puis d12 avec de l'XP.</p>
<p><b>Déplacement :</b> 6 cases (30 pieds) par tour. Le talent Pas rapide ajoute 2 cases par rang (2 rangs, 40 XP chacun). Une armure lourde retire 2 cases.</p>
<h3>Barème d'XP (v0.4)</h3>
<p>Le niveau vaut l'XP gagnée divisée par 100 : 150 XP pour créer un personnage de niveau 1, 2 000 au niveau 20. L'onglet Personnage fait tous les calculs.</p>
<table><thead><tr><th>Achat</th><th>Coût de chaque palier</th><th>Total</th></tr></thead><tbody>
<tr><td>Stat (intention ou domaine), chaque +1</td><td>20, 40, 80, 160, 320… (−1 rend 20)</td><td>+3 : 140, +5 : 620</td></tr><tr><td>Talent (chapitre 7), par rang</td><td>40, 80, 160 (Savoir-faire : 20, 40, 80)</td><td>—</td></tr><tr><td>Entraînement aux armures : légères, intermédiaires, lourdes</td><td>20, 40, 80</td><td>140</td></tr><tr><td>Entraînement aux boucliers</td><td>40</td><td>40</td></tr>
<tr><td>Tier d'une discipline (école, famille d'armes ou Apex), de 1 à 5</td><td>40, 80, 160, 240, 320</td><td>840</td></tr>
<tr><td>Dé de vie d8, d10, d12</td><td>80, 160, 240</td><td>480</td></tr></tbody></table>
<p><b>Entraînement aux armures et aux boucliers :</b> comme les maîtrises de D&D. Porter une armure sans l'entraînement correspondant ne donne aucune valeur d'armure (les seuils sont ceux d'un corps sans armure) et −2 à l'Esquive. Un bouclier sans entraînement ne donne ni bonus ni Parade. Les armures intermédiaires demandent d'abord l'entraînement léger, les lourdes l'intermédiaire.</p>
<p><b>Spécialisation :</b> les disciplines sont classées par Tier. La plus haute coûte le prix normal, la 2e ×1,5, la 3e ×2, toutes les suivantes ×3. Au niveau 20 (2 000 XP), cela permet une discipline au Tier 5 et une deuxième au Tier 4, avec la matrice et un d8 ; un tank qui prend le d12 se contente d'un Tier 5 et d'un Tier 3.</p>
<p><b>Paliers de Tier :</b> Tier 2 dès le niveau 3, Tier 3 dès le 5, Tier 4 dès le 11, Tier 5 dès le 17, comme les grands paliers de D&D.</p>
<h2 id="r-defense">3. Défense : Esquive et armure</h2>
<p>La classe d'armure disparaît. L'attaquant lance d20 + bonus contre l'<b>Esquive</b> de la cible. S'il touche, l'<b>armure</b> détermine combien le coup coûte.</p>
<p><b>Esquive = 10 + Finesse physique (plafonnée par l'armure) + bouclier + bonus divers.</b></p>
<p><b>Valeur d'armure = CA de base de l'armure dans D&D − 10.</b> Elle fixe le seuil Mineur et s'ajoute aux seuils Majeur et Sévère.</p>
<table><thead><tr><th>Armure</th><th>Catégorie</th><th>Finesse dans l'Esquive</th><th class="r">Valeur</th></tr></thead><tbody>
<tr><td>Aucune</td><td>—</td><td>totale</td><td class="r">0</td></tr><tr><td>Cuir</td><td>Légère</td><td>totale</td><td class="r">1</td></tr><tr><td>Cuir clouté</td><td>Légère</td><td>totale</td><td class="r">2</td></tr>
<tr><td>Chemise de mailles</td><td>Intermédiaire</td><td>max +2</td><td class="r">3</td></tr><tr><td>Cuirasse, écailles</td><td>Intermédiaire</td><td>max +2</td><td class="r">4</td></tr><tr><td>Demi-plate</td><td>Intermédiaire</td><td>max +2</td><td class="r">5</td></tr>
<tr><td>Cotte de mailles</td><td>Lourde</td><td>aucune</td><td class="r">6</td></tr><tr><td>Clibanion</td><td>Lourde</td><td>aucune</td><td class="r">7</td></tr><tr><td>Harnois</td><td>Lourde</td><td>aucune</td><td class="r">8</td></tr></tbody></table>
<h3>Boucliers</h3>
<p><b>Parade (réaction) :</b> quand tu es touché, le coup coûte une case de moins (2 devient 1, 1 devient 0). Une fois par round ; chaque Parade supplémentaire coûte 1 Souffle.</p>
<table><thead><tr><th>Bouclier</th><th class="r">Esquive</th><th>Parade</th><th>Particularité</th></tr></thead><tbody>
<tr><td>Bocle</td><td class="r">+0</td><td>Corps à corps uniquement</td><td>Main presque libre : on peut lancer un sort ou tenir un objet</td></tr>
<tr><td>Rondache</td><td class="r">+1</td><td>Oui</td><td>Léger, aucun malus</td></tr>
<tr><td>Écu</td><td class="r">+1</td><td>Oui, y compris contre les projectiles</td><td>Le bouclier standard</td></tr>
<tr><td>Grand bouclier</td><td class="r">+2</td><td>Oui + Interception</td><td>Désavantage en Discrétion</td></tr>
<tr><td>Pavois</td><td class="r">+2</td><td>Oui + Interception</td><td>Planter (action bonus) : abri pour soi et un allié derrière ; déplacement −10 pieds (3 m) tant qu'on le porte</td></tr></tbody></table>
<p><b>Interception :</b> la Parade peut protéger un allié adjacent à ta place.</p>
<h2 id="r-vitalite">4. Dégâts et Vitalité</h2>
<p>Il n'y a plus de points de vie à soustraire. On compare les dégâts d'un coup aux seuils de la cible :</p>
<table><thead><tr><th>Dégâts du coup</th><th class="r">Cases perdues</th></tr></thead><tbody>
<tr><td>Sous le seuil Mineur</td><td class="r">0 (mais l'usure s'applique)</td></tr><tr><td>Du Mineur au Majeur</td><td class="r">1</td></tr><tr><td>Majeur ou plus</td><td class="r">2</td></tr><tr><td>Sévère ou plus</td><td class="r">3</td></tr></tbody></table>
<ul><li><b>Seuil Mineur</b> = valeur d'armure</li><li><b>Base</b> = valeur maximale du dé de vie + niveau + mod. de Résistance physique</li><li><b>Seuil Majeur</b> = Base + valeur d'armure</li><li><b>Seuil Sévère</b> = 2 × Base + valeur d'armure</li><li><b>Cases de Vitalité</b> = 1 + (niveau × dé de vie ÷ 12), arrondi au supérieur</li></ul>
<table><thead><tr><th>Niveau</th><th class="r">d6</th><th class="r">d8</th><th class="r">d10</th><th class="r">d12</th></tr></thead><tbody>
<tr><td>1</td><td class="r">2</td><td class="r">2</td><td class="r">2</td><td class="r">2</td></tr><tr><td>5</td><td class="r">4</td><td class="r">5</td><td class="r">6</td><td class="r">6</td></tr><tr><td>10</td><td class="r">6</td><td class="r">8</td><td class="r">10</td><td class="r">11</td></tr><tr><td>20</td><td class="r">11</td><td class="r">15</td><td class="r">18</td><td class="r">21</td></tr></tbody></table>
<p><b>Usure :</b> un coup arrêté par l'armure ne coûte pas de case, mais il coûte 1 Souffle. Quand le Souffle est vide, chaque coup arrêté coûte une case. Personne n'est invincible face au nombre.</p>
<p><b>À 0 case :</b> le personnage tombe inconscient et fait des jets de sauvegarde contre la mort, comme dans D&D.</p>
<p class="note">Calibrage : à tous les niveaux testés (1, 5 et 10), un personnage tombe après autant d'attaques que dans D&D, à 10 % près.</p>
<h2 id="r-maitrise">5. Maîtrise et magie</h2>
<p>Sorts et armes suivent la même règle. Ta <b>Maîtrise</b> dans une école ou une arme est ton Tier, de 1 à 5. Elle donne le nombre de dés lancés ; ce que tu utilises donne le type de dé.</p>
<ol><li><b>Attaque de base, gratuite.</b> Arme : Maîtrise × dé de l'arme + modificateur. Sort de base de l'école : Maîtrise × le dé de l'école, sans modificateur (voir le tableau des écoles).</li>
<li><b>Effets.</b> Chaque effet vaut de 1 à 5. La somme des valeurs coûte autant de Mana et ne peut pas dépasser ton Tier dans l'école.</li>
<li><b>Circonstances.</b> Un bonus ou un malus modifie la Maîtrise de ±1 : allié qui inspire, Rage, cible affaiblie ou aveuglée.</li></ol>
<h3>Les écoles</h3><p>Chaque école a son propre dé de dégâts (sort de base et infusion) et une <b>affinité</b> : un effet de signature qui lui coûte moins cher. Plus le dé est petit, plus l'affinité est forte.</p>
<table><thead><tr><th>École</th><th>Dé</th><th>Affinité</th><th>Domaine</th></tr></thead><tbody>
<tr><td>Afflux</td><td>d12</td><td>—</td><td>Destruction, comme l'évocation</td></tr>
<tr><td>Mirage</td><td>d8</td><td>Contrôle lourd 1, contrôle majeur 2</td><td>Dégâts psychiques, illusions, peur et charme</td></tr>
<tr><td>Eidolon</td><td>d8</td><td>Persistance 1</td><td>Les âmes : malédictions et purification</td></tr>
<tr><td>Égide</td><td>d8</td><td>Bouclier d'Égide 1</td><td>Énergie condensée jusqu'à devenir matière : boucliers, armes invoquées</td></tr>
<tr><td>Creuset</td><td>d8</td><td>Soin : 2 cases par point</td><td>Transmutation et guérison</td></tr>
<tr><td>Horizon</td><td>d6</td><td>Déport 0 (gratuit) ; seule école à pouvoir téléporter</td><td>Espace et temps : téléportation, portails, ralentir le temps</td></tr>
<tr><td>Harmonie</td><td>d6</td><td>Multiplication 1 par cible</td><td>Résonance : bardes, influence sur le champ de bataille</td></tr></tbody></table>
<h3>Maîtrises d'armes</h3><p>On achète une maîtrise par famille d'armes ; elle vaut pour toutes les armes de la famille. Le gabarit de l'arme donne le dé. Le sort de base de chaque école utilise son propre dé (tableau ci-dessous).</p>
<table><thead><tr><th>Famille</th><th>Exemples</th><th>Particularité</th></tr></thead><tbody><tr><td>Armes de taille</td><td>Épée, hache, sabre, cimeterre</td><td>À définir</td></tr><tr><td>Armes d'estoc</td><td>Rapière, dague, épée courte, estoc</td><td>À définir</td></tr><tr><td>Armes contondantes</td><td>Masse, marteau, fléau, bâton</td><td>Proposition : ignore 2 points de valeur d'armure</td></tr><tr><td>Armes d'hast</td><td>Lance, hallebarde, glaive, pique</td><td>Proposition : allonge, frappe à 10 pieds (3 m)</td></tr><tr><td>Armes de tir et de jet</td><td>Arc, arbalète, javelot, fronde</td><td>Frappe à distance</td></tr><tr><td>Arts martiaux</td><td>Poings, pieds, genoux, coudes</td><td>Utilise la Finesse physique. d6 avec une main occupée, d8 mains libres. Proposition : impossible à désarmer, et saisir ou renverser ne demande pas d'arme</td></tr><tr><td>Armes naturelles</td><td>Griffes, crocs, cornes, queue</td><td>Utilise la Puissance physique. Le dé dépend de la taille de l'arme naturelle, pas des mains : petite d6, moyenne d8, grande d10, énorme d12. Impossible à désarmer ; liée au peuple ou à une transformation</td></tr></tbody></table>
<table><thead><tr><th>Gabarit</th><th>Dé</th></tr></thead><tbody><tr><td>Arme à une main</td><td>d6</td></tr><tr><td>Arme polyvalente tenue à une main</td><td>d8</td></tr><tr><td>Arme polyvalente tenue à deux mains</td><td>d10</td></tr><tr><td>Arme à deux mains</td><td>d12</td></tr></tbody></table>
<h3>Effets de sorts</h3>
<table><thead><tr><th>Effet</th><th class="r">Valeur</th></tr></thead><tbody>
<tr><td>Coup appuyé : si le sort touche, +1 case (une fois par sort)</td><td class="r">1</td></tr><tr><td>Déport : lancer depuis un autre point</td><td class="r">1</td></tr><tr><td>Déplacement non instantané de soi ou d'une cible (vol, poussée…)</td><td class="r">1</td></tr><tr><td>Horizon seulement : téléportation de soi ou d'une cible consentante (un allié) ; Multiplication pour chaque personne en plus, comme pour ouvrir un portail</td><td class="r">2</td></tr><tr><td>Horizon seulement : téléportation d'une cible ennemie, qui fait un jet de sauvegarde</td><td class="r">3</td></tr>
<tr><td>Multiplication : une cible de plus</td><td class="r">2 par cible</td></tr><tr><td>Contrôle léger : repousser, ralentir</td><td class="r">1</td></tr><tr><td>Contrôle lourd : plaquer, entraver, aveugler</td><td class="r">2</td></tr><tr><td>Contrôle majeur : étourdir, paralyser</td><td class="r">3</td></tr>
<tr><td>Persistance ou mur : l'effet dure 1 minute</td><td class="r">2</td></tr><tr><td>Zone : toutes les créatures dans 20 pieds (6 m) ; comme dans D&D, une sauvegarde réussie fait subir la moitié des dégâts</td><td class="r">3</td></tr></tbody></table>
<p class="ex">Exemple : un mage du Creuset de Tier 2 lance son pic de terre gratuitement (2d8). Le plaquer sous la roche est un effet de valeur 2 : il coûte 2 Mana. Plaquer + Zone (2 + 3 = 5) demande le Tier 5.</p>
<h3>Mana</h3>
<p>Le Mana vient des Tiers achetés dans les écoles : chaque école en apporte selon son Tier, et on additionne les écoles. Un martial qui touche à une école n'en tire que 2 à 6 points. Sa récupération est décrite au chapitre Soins et repos.</p>
<table><thead><tr><th>Tier dans l'école</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th></tr></thead><tbody><tr><td>Mana apporté (cumulé)</td><td class="r">2</td><td class="r">6</td><td class="r">14</td><td class="r">24</td><td class="r">36</td></tr></tbody></table>
<p><b>Bonus de Résistance mentale :</b> + modificateur × la moitié du plus haut Tier en magie, arrondie à l'inférieur.</p>
<p class="note">Repères pour un mage pur : niveau 1, 2 Mana ; niveau 5 (Tiers 3 et 1), 16 ; niveau 10 (Tiers 3, 3 et 2), 34 ; niveau 20 (Tiers 5, 4 et 3), 74. C'est la journée d'un magicien de D&D à 15 % près.</p>
<h2 id="r-souffle">6. Le Souffle</h2>
<p>Le Souffle est l'épuisement du corps, comme le Mana est celui de l'esprit. Il se recharge entièrement au repos court.</p>
<p><b>Réserve = la somme du Souffle apporté par chaque famille d'armes maîtrisée + modificateur de Résistance physique.</b> Un mage pur n'a que son modificateur.</p>
<table><thead><tr><th>Tier dans la famille</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th></tr></thead><tbody><tr><td>Souffle apporté (cumulé)</td><td class="r">1</td><td class="r">3</td><td class="r">7</td><td class="r">12</td><td class="r">18</td></tr></tbody></table>
<p><b>Le Souffle paie :</b> les manœuvres martiales, les Parades au-delà de la première, l'usure, et l'action supplémentaire dans le tour (3 Souffle, pour tout le monde). <b>Il ne paie jamais</b> les effets de sorts.</p>
<table><thead><tr><th>Manœuvre</th><th class="r">Valeur</th></tr></thead><tbody>
<tr><td>Coup appuyé : si le coup touche, +1 case</td><td class="r">1</td></tr><tr><td>Clive : un ennemi adjacent de plus</td><td class="r">2 par cible</td></tr><tr><td>Charge ou bond : se déplacer avant de frapper</td><td class="r">1</td></tr>
<tr><td>Lancer ou allonge : frapper plus loin</td><td class="r">1</td></tr><tr><td>Bousculer, brise-garde</td><td class="r">1</td></tr><tr><td>Désarmer, renverser, immobiliser</td><td class="r">2</td></tr>
<tr><td>Posture tenue : un effet maintenu 1 minute</td><td class="r">2</td></tr><tr><td>Tourbillon : tous les ennemis adjacents</td><td class="r">3</td></tr><tr><td>Parade supplémentaire dans le round</td><td class="r">1</td></tr><tr><td>Action supplémentaire dans le tour</td><td class="r">3</td></tr></tbody></table>
<p class="ex">Au niveau 5, un guerrier au Tier 3 en armes de taille et au Tier 1 en armes de tir, avec +3 de Résistance physique, a 11 Souffle par combat, soit 33 sur une journée avec deux repos courts. Un mage a 19 Mana pour toute la journée : il frappe fort une fois, le guerrier tient la distance.</p>
<h3>Apex</h3><p>L'Apex est une puissance physique anormale : ce n'est pas de la magie, mais ce n'est pas normal non plus. Il s'achète par Tier comme une famille d'armes (mêmes coûts en XP et mêmes paliers de niveau).</p><ul><li><b>Souffle :</b> chaque Tier d'Apex ajoute du Souffle exactement comme une famille d'armes (1, 3, 7, 12, 18 cumulés).</li><li><b>Armure naturelle = 2 × Tier d'Apex</b> (de 2 à 10). Elle ne se cumule pas avec l'armure portée : on garde la meilleure valeur. L'armure naturelle ne plafonne jamais l'Esquive.</li><li><b>Infusion :</b> l'Apex peut infuser un coup d'arme (voir ci-dessous).</li></ul>
<h3>Infusion (v0.3)</h3><p>Un personnage qui maîtrise à la fois une famille d'armes et une source de puissance peut infuser son coup : le coup inflige des dégâts en plus. L'infusion a une valeur de 1 jusqu'à ton Tier dans la source, et <b>chaque point coûte 1 Mana</b> (une école) <b>ou 1 Souffle</b> (l'Apex) et ajoute <b>un dé</b> : le dé de dégâts de l'école (d8) pour une école, le dé de l'arme pour l'Apex. C'est payé au moment de déclarer l'attaque, même si le coup rate ; les dés en plus s'ajoutent aux dégâts de ce coup. La source est une école de magie (un praticien du Creuset augmente le tranchant ou la densité de sa lame, un adepte de l'Égide enrobe sa masse d'énergie solidifiée) ou l'Apex (un coup porté avec une force démesurée). Une infusion par coup.</p><p><b>Les types de dégâts viennent du récit.</b> À la création du personnage, le joueur et le MJ fixent ensemble ce que son école peut produire : l'Égide, énergie solidifiée, aura du mal à infliger autre chose que des dégâts de force, contondants ou physiques ; un praticien de l'Afflux peut infliger des dégâts de force, de feu ou radiants, selon son lore et ce qu'il sait faire. La scène peut resserrer ou élargir ces limites.</p>
<h2 id="r-talents">7. Talents</h2>
<p>Les talents sont les capacités de classe de D&D, à la carte. On les achète en XP comme le reste, autant qu'on veut, tant que le récit suit : une Rage a besoin d'une raison de se mettre en rage, un Compagnon d'une rencontre. Le rang 2 s'ouvre au niveau 5, le rang 3 au niveau 11. Sauf mention, un talent coûte 40, 80 puis 160 XP par rang.</p>

<h3>Savoir-faire</h3><p>Choisis un domaine précis : crochetage, pistage, herboristerie, histoire de Luparis, navigation… Tes tests dans ce domaine ajoutent +2, +4 puis +6 (rangs 1 à 3, pour 20, 40 puis 80 XP). Achetable pour autant de domaines que tu veux. C'est la réponse à « mon personnage sait-il faire ça ? » hors combat.</p>
<h2 id="r-jets">8. Jets, DD et états</h2>
<p>Les jets reprennent D&D, avec la Maîtrise à la place du bonus de maîtrise.</p>
<ul><li><b>Bonus de Maîtrise = Tier + 1</b> (de +2 à +6).</li><li><b>Jet d'attaque</b> = d20 + modificateur de la case + bonus de Maîtrise, contre l'Esquive. Sur un 20 naturel, on double les dés de Maîtrise.</li><li><b>DD d'un sort ou d'une manœuvre</b> = 8 + modificateur de la case utilisée + bonus de Maîtrise.</li><li><b>DD d'un effet laissé sur le terrain</b> (flammes, acide, glace, toiles…) = 10 + Résistance de son auteur, dans le domaine que le récit désigne (physique, mental ou social). Sur la carte, le DD se règle à côté de l'outil Effet.</li><li><b>Relief sur la battle map :</b> une case d'élévation 1 est un terrain difficile ; l'élévation 2 demande un saut ou une escalade ; l'élévation 3 demande un saut en hauteur (réservé aux personnages assez forts), le vol ou un jet d'escalade. Le saut utilise la Puissance physique, l'escalade la Puissance ou la Finesse physique, au DD fixé par le MJ.</li><li><b>Résistance et vulnérabilité</b> divisent ou doublent les dégâts avant la comparaison aux seuils.</li></ul>
<h3>Sauvegardes</h3>
<table><thead><tr><th>Sauvegarde D&D</th><th>Domaine Luparis</th></tr></thead><tbody>
<tr><td>Force, Dextérité, Constitution</td><td>Physique</td></tr><tr><td>Intelligence, Sagesse</td><td>Mental</td></tr><tr><td>Charisme</td><td>Social</td></tr></tbody></table>
<p><b>L'intention dépend du récit.</b> La menace fixe le domaine ; la façon dont le joueur décrit sa réaction fixe l'intention. Par défaut, c'est la Résistance. Plonger hors d'une explosion : Finesse physique. Tenir face à une poussée : Puissance physique. Encaisser un poison : Résistance physique. Démasquer une illusion : Finesse mentale. Le MJ valide si la description colle à la situation.</p>
<h3>Difficultés</h3>
<table><thead><tr><th class="r">DD</th><th>Difficulté</th></tr></thead><tbody><tr><td class="r">10</td><td>Facile</td></tr><tr><td class="r">15</td><td>Moyen</td></tr><tr><td class="r">20</td><td>Difficile</td></tr><tr><td class="r">25</td><td>Très difficile</td></tr><tr><td class="r">30</td><td>Quasi impossible</td></tr></tbody></table>
<h3>Effets de contrôle</h3>
<p>Un état dure jusqu'à la fin du prochain tour de la cible. Avec Persistance, elle refait sa sauvegarde à la fin de chacun de ses tours.</p>
<table><thead><tr><th>Effet</th><th class="r">Valeur</th><th>États possibles</th></tr></thead><tbody>
<tr><td>Contrôle léger</td><td class="r">1</td><td>Repoussé de 10 pieds (3 m), ou ralenti (−10 pieds de vitesse)</td></tr><tr><td>Contrôle lourd</td><td class="r">2</td><td>À terre, agrippé, entravé, aveuglé, assourdi, effrayé, charmé</td></tr><tr><td>Contrôle majeur</td><td class="r">3</td><td>Étourdi, paralysé</td></tr></tbody></table>
<p><b>Pas de dégâts sur la durée :</b> brûlure, saignement ou poison qui ronge se traduisent par un seul coup, ou par l'état empoisonné.</p>
<h3>Les états</h3>
<table><thead><tr><th>État</th><th>Effet</th></tr></thead><tbody>
<tr><td>Agrippé</td><td>Vitesse 0. Désavantage aux attaques contre d'autres cibles que celle qui l'agrippe. Se libérer : action, jet Physique contre le DD.</td></tr>
<tr><td>À terre</td><td>Se déplace en rampant ; se relever coûte la moitié du déplacement. Désavantage à ses attaques. Avantage aux attaques au contact contre lui, désavantage à distance.</td></tr>
<tr><td>Assourdi</td><td>N'entend plus ; échoue à ce qui demande l'ouïe.</td></tr>
<tr><td>Aveuglé</td><td>Échoue à ce qui demande la vue. Désavantage à ses attaques, avantage aux attaques contre lui.</td></tr>
<tr><td>Charmé</td><td>Ne peut pas attaquer celui qui l'a charmé, qui a l'avantage sur ses jets sociaux contre lui.</td></tr>
<tr><td>Effrayé</td><td>Désavantage à ses jets tant qu'il voit la source ; ne peut pas s'en approcher volontairement.</td></tr>
<tr><td>Empoisonné</td><td>Désavantage aux jets d'attaque et aux tests.</td></tr>
<tr><td>Entravé</td><td>Vitesse 0. Désavantage à ses attaques et à ses sauvegardes physiques ; avantage aux attaques contre lui.</td></tr>
<tr><td>Épuisement</td><td>Niveaux 1 à 6 : chaque niveau donne −2 à tous les d20 et −5 pieds de vitesse. Au niveau 6, la mort. Un repos long retire un niveau.</td></tr>
<tr><td>Étourdi</td><td>Neutralisé. Échoue à ses sauvegardes physiques ; avantage aux attaques contre lui.</td></tr>
<tr><td>Inconscient</td><td>Neutralisé et à terre, lâche ce qu'il tient. Échoue à ses sauvegardes physiques ; avantage contre lui, et un coup au contact est critique.</td></tr>
<tr><td>Invisible</td><td>Avantage à ses attaques, désavantage aux attaques contre lui, tant qu'on ne le localise pas.</td></tr>
<tr><td>Neutralisé</td><td>Aucune action, action bonus ni réaction : il ne peut donc pas parer.</td></tr>
<tr><td>Paralysé</td><td>Neutralisé, vitesse 0. Échoue à ses sauvegardes physiques ; avantage contre lui, et un coup au contact est critique.</td></tr>
<tr><td>Pétrifié</td><td>Changé en pierre et neutralisé ; résistance à tous les dégâts.</td></tr></tbody></table>
<h2 id="r-soins">9. Soins et repos</h2>
<p>On récupère de trois façons : le repos, les consommables et la magie. Les dés de vie de D&D ne servent plus à se soigner ; ils ne définissent que les seuils et les cases.</p>
<h3>Repos</h3>
<table><thead><tr><th>Repos</th><th>Durée</th><th>Cases de Vitalité</th><th>Mana</th><th>Souffle</th></tr></thead><tbody>
<tr><td>Court</td><td>1 heure</td><td>La moitié des cases manquantes (arrondie au supérieur)</td><td>La moitié du Mana manquant</td><td>Tout</td></tr>
<tr><td>Long</td><td>8 heures</td><td>Tout</td><td>Tout</td><td>Tout, et un niveau d'épuisement en moins</td></tr></tbody></table>
<h3>Consommables</h3>
<table><thead><tr><th>Consommable</th><th>Effet</th></tr></thead><tbody>
<tr><td>Potion de soins</td><td>1 case</td></tr><tr><td>Potion de soins supérieure</td><td>2 cases</td></tr><tr><td>Potion de soins majeure</td><td>3 cases</td></tr><tr><td>Potion de soins suprême</td><td>5 cases</td></tr>
<tr><td>Repas chaud (pendant un repos court)</td><td>1 case de plus que le repos</td></tr><tr><td>Tonique de vigueur</td><td>3 Souffle (proposition)</td></tr><tr><td>Élixir de Mana</td><td>2, 6 ou 14 Mana selon sa qualité (à confirmer)</td></tr></tbody></table>
<h3>Magie de soin</h3>
<p>Le Creuset soigne en refermant la chair ; l'Harmonie fait résonner la régénération naturelle. Le soin est un effet comme les autres, payé en Mana et plafonné par le Tier.</p>
<table><thead><tr><th>Effet</th><th class="r">Valeur</th><th>Écoles</th></tr></thead><tbody>
<tr><td>Stabiliser une créature à 0 case</td><td class="r">0</td><td>Creuset, Harmonie (sort de base)</td></tr>
<tr><td>Soin : la cible regagne 1 case</td><td class="r">1 par case</td><td>Creuset, Harmonie</td></tr>
<tr><td>Chant de repos : pendant un repos court, le groupe regagne 1 case de plus</td><td class="r">1</td><td>Harmonie, hors combat</td></tr></tbody></table>
<p>Un soin se combine avec les autres effets : Soin + Déport pour soigner à distance, Soin + Zone pour soigner tout le groupe (valeur 4). Une créature à 0 case qui regagne une case reprend conscience.</p>
<p class="ex">Proposition pour l'Égide, qui protège plutôt qu'elle ne soigne. Bouclier d'Égide, valeur 2 : un allié annule la prochaine case qu'il devrait perdre avant ton prochain tour.</p>
<h2 id="r-mj">10. Chapitre du MJ</h2>
<h3>Convertir un monstre de D&D</h3>
<p>Esquive = CA du monstre. Seuils et cases selon son FP. Le Bestiaire de ce site fait le calcul automatiquement.</p>
<table><thead><tr><th>FP</th><th class="r">Majeur</th><th class="r">Sévère</th><th class="r">Cases</th></tr></thead><tbody>
<tr><td>0 à 1</td><td class="r">8</td><td class="r">16</td><td class="r">PV ÷ 6 (min. 1)</td></tr><tr><td>2 à 4</td><td class="r">12</td><td class="r">24</td><td class="r">PV ÷ 6</td></tr><tr><td>5 à 10</td><td class="r">18</td><td class="r">36</td><td class="r">PV ÷ 12</td></tr><tr><td>11 à 16</td><td class="r">23</td><td class="r">46</td><td class="r">PV ÷ 18</td></tr><tr><td>17 et plus</td><td class="r">28</td><td class="r">56</td><td class="r">PV ÷ 24</td></tr></tbody></table>
<h3>Arbitrer un effet imprévu</h3>
<p>Cherche le sort de D&D qui ressemble le plus à l'idée du joueur. Son niveau donne la valeur : niveaux 1 à 3, même valeur ; 4 et 5, valeur 4 ; 6 et plus, valeur 5.</p>
<h3>Terrain</h3>
<p>Sur la carte tactique : +1 couvert partiel, +2 couvert, +3 obstacle infranchissable ; −1 terrain difficile, −2 infranchissable.</p>

function kbHints(){for(const e of document.querySelectorAll('[data-kb]'))e.removeAttribute('data-kb');
 document.querySelectorAll('.tabs a').forEach((a,i)=>a.setAttribute('data-kb',klab('Digit'+(i+1))));
 const r=kbRows();[[1,KROW1],[2,KROW2],[3,KROW3]].forEach(([n,codes])=>r[n].forEach((el,i)=>{if(el&&codes[i]){const tgt=el.tagName==='INPUT'&&el.type==='checkbox'?el.closest('label')||el:el;tgt.setAttribute('data-kb',klab(codes[i]))}}))}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
 const c=e.code,dm=/^Digit([1-5])$/.exec(c);
 if(dm&&!e.shiftKey){const a=document.querySelectorAll('.tabs a')[+dm[1]-1];if(a){e.preventDefault();location.hash=a.getAttribute('href')}return}
 const r=kbRows();for(const[n,codes]of[[1,KROW1],[2,KROW2],[3,KROW3]]){const i=codes.indexOf(c);if(i<0)continue;const el=r[n][i];if(!el)return;e.preventDefault();e.stopImmediatePropagation();
  if(el.tagName==='INPUT'&&el.type==='checkbox'){el.checked=!el.checked;el.dispatchEvent(new Event('change',{bubbles:true}))}else if(el.tagName==='INPUT'||el.tagName==='SELECT')el.focus();else el.click();return}},true);
window.addEventListener('hashchange',()=>setTimeout(kbHints));setTimeout(kbHints,50);

legend();layout();
}
</script>
</body>
</html>
