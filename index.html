</div>

    <button data-t="tpl" data-i18n="t_tpl"></button>

    <p class="small" id="in_round"></p><div id="in_xp" hidden></div><ol class="ini" id="in_list"></ol></section>
</aside></div>

</div>

    <div id="ai_out"></div>
  </details>

    <form class="mf" id="mf">
      <input type="hidden" id="mid">

      <label><span data-i18n="f_type"></span> <input id="mty" list="types" required></label>
      <label><span data-i18n="c_cr"></span> <select id="mfp"></select></label>
      <label><span data-i18n="m_sz"></span> <select id="msz"></select></label>
      <label><span data-i18n="m_ac"></span> <input id="mca" type="number" min="1" max="30" value="12" required></label>
      <label><span data-i18n="m_hp"></span> <input id="mpv" type="number" min="1" max="999" value="10" required></label>
      <label><span data-i18n="m_init"></span> <input id="min" type="number" min="-5" max="15" value="0"></label>

      <div class="wide matkf" id="matk"></div>
      <label class="wide"><span data-i18n="m_notes"></span> <textarea id="mno" rows="2" data-i18n-ph="m_notes_ph"></textarea></label>

      <div class="row wide"><button class="go" type="submit" data-i18n="save"></button><button type="button" id="mcancel" data-i18n="cancel"></button><span class="small" id="mprev"></span></div>

  <details><summary data-i18n="io_sum"></summary>

    <textarea id="imp" rows="4" style="margin-top:8px" data-i18n-ph="imp_ph"></textarea>
  </details>
</div>

        <div class="two"><label><span data-i18n="sk_armor"></span><select id="c_armor"></select></label><label><span data-i18n="sk_shield"></span><select id="c_shield"></select></label></div>
        <div class="stats" id="c_def"></div><div id="c_prof"></div></section></div><div class="scol"><div class="scolh" data-en="2 · Talents and weapons" data-fr="2 · Talents et armes"></div><section class="card mod" data-mod="don"><h3 data-i18n="sk_don"></h3><div id="c_don" class="tiers"></div></section><section class="card mod" data-mod="atk"><h3 data-i18n="sk_atk"></h3>
        <label class="tgt"><span data-i18n="sk_target"></span><input id="c_tgt" type="number" min="0" max="40" placeholder="—"></label>
        <div id="c_atk"></div>
        <details><summary data-i18n="sk_addw"></summary><form id="c_wf" class="two">
          <label><span data-i18n="sk_wname"></span><input id="c_wn" required></label>
          <label><span data-i18n="sk_fam"></span><select id="c_wfam"></select></label>
          <label><span data-i18n="sk_size"></span><select id="c_wsz"></select></label>
          <div class="row"><button class="go" type="submit" data-i18n="sk_add"></button></div></form></details>
      </section></div><div class="scol"><div class="scolh" data-en="3 · Masteries" data-fr="3 · Maîtrises"></div><section class="card mod" data-mod="fam"><h3 data-i18n="sk_fams"></h3><div id="c_fam" class="tiers"></div></section><section class="card mod" data-mod="sch"><h3 data-i18n="sk_schools"></h3><div id="c_sch" class="tiers"></div></section><section class="card mod" data-mod="apx"><h3>Apex</h3><p class="small" id="c_apxn"></p><div id="c_apx" class="tiers"></div></section></div><div class="gone"><section class="card mod" data-mod="res"><h3 data-i18n="sk_res"></h3><div id="c_trk"></div>

  <details><summary data-i18n="sk_io"></summary>
    <p class="small" data-i18n="sk_costs"></p>
    <div class="row"><button type="button" id="c_copy" data-i18n="sk_copy"></button><button type="button" id="c_imp" data-i18n="sk_import"></button><button type="button" id="c_del" data-i18n="sk_del"></button><span class="small" id="c_msg"></span></div>
    <textarea id="c_paste" rows="3" style="margin-top:8px"></textarea>
  </details>
</div></div><datalist id="c_camps"></datalist>
